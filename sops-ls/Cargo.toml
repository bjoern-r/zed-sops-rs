[package]
name = "sops-ls"
version = "0.1.0"
edition = "2021"
description = "Language server for SOPS-encrypted YAML, JSON, dotenv and INI files"
license = "MIT"

# Standalone workspace so it doesn't get pulled into the Zed extension crate.
[workspace]

[dependencies]
tower-lsp-server = "0.23"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "process", "time", "sync", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
yaml-rust2 = "0.13"
tempfile = "3"

[profile.release]
lto = true
strip = true
codegen-units = 1
