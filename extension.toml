id = "sops"
name = "SOPS"
description = "Work with SOPS-encrypted YAML, JSON, dotenv and INI files: hover-to-decrypt, decrypt/re-encrypt in the editor, MAC and key checks."
version = "0.1.0"
schema_version = 1
authors = ["Bjoern <bjoern.c3@nixda.biz>"]
repository = "https://github.com/bjoern-r/zed-sops-rs"

[language_servers.sops-ls]
name = "SOPS Language Server"
languages = ["YAML", "JSON", "JSONC", "INI", "Env"]

[language_servers.sops-ls.language_ids]
"YAML" = "yaml"
"JSON" = "json"
"JSONC" = "jsonc"
"INI" = "ini"
"Env" = "dotenv"
